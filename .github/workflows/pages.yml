name: Deploy Community Hub to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Validate content snapshot
        run: |
          node -e "const d=JSON.parse(require('fs').readFileSync('data/content.json','utf8')); if(d.format!==1) throw new Error('format'); if(d.site.site.apiUrl && !/^https:\/\//.test(d.site.site.apiUrl)) throw new Error('apiUrl must be https'); console.log('content.json ok, revision', d.revision)"
          node --input-type=module --check < hub.js
      - name: Assemble site
        run: |
          mkdir _site
          cp -r index.html hub.css hub.js assets data .nojekyll _site/
          cp _site/index.html _site/404.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
